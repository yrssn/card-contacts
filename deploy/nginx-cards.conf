# 放到 shared-proxy 的 conf.d/ 下（例如 inventoryui.moneymoon.jp.conf），然后 docker exec shared-proxy nginx -s reload
# 证书用 certbot 申请后把路径改掉；没证书前可先只保留 80 段测试
server {
    listen 80;
    server_name inventoryui.moneymoon.jp;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name inventoryui.moneymoon.jp;

    ssl_certificate     /etc/letsencrypt/live/inventoryui.moneymoon.jp/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/inventoryui.moneymoon.jp/privkey.pem;

    client_max_body_size 30m;          # 名片照片上传

    location / {
        # shared-proxy 在容器里，访问宿主机端口用 host.docker.internal 或宿主机内网 IP
        proxy_pass http://host.docker.internal:9282;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;       # 视觉模型识别可能较慢
    }
}
